# Default values for speedtest.

image:
  repository: miguelndecarvalho/speedtest-exporter
  tag: "latest"

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  port: 9798

# Variables d'environnement du conteneur speedtest-exporter
# Ref: https://github.com/MiguelNdeCarvalho/speedtest-exporter#environment-variables
env:
  # Duree de mise en cache du resultat entre deux tests reels, evite de saturer
  # la bande passante internet a chaque scrape Prometheus. Valeur en secondes
  # (l'exporter fait un int() dessus, pas de suffixe "m"/"h" accepte).
  SPEEDTEST_CACHE_FOR: "1800"
  # SPEEDTEST_SERVER: ""

# Prometheus scrape ce pod automatiquement via le job "kubernetes-pods"
# deja configure dans helm_prometheus (annotations standard prometheus.io/*)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9798"
  prometheus.io/path: "/metrics"

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

tolerations: []
# - key: "node-role.kubernetes.io/control-plane"
#   operator: "Exists"
#   effect: "NoSchedule"

nodeSelector: {}
